[workspace]
name = "predicting-smartphone-addiction"
version = "0.1.0"
description = "Kaggle Playground Series S6E8 — Predicting Smartphone Addiction"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
# Notebooks
marimo = "*"
ipykernel = "*"
# Data handling
polars = "*"
pandas = "*"
pyarrow = "*"
# ML & compute
scikit-learn = "*"
xgboost = "*"
joblib = "*"
# Visualization
altair = "*"
# Utilities
tqdm = "*"
pydantic-ai-slim = ">=2.33.0,<3"
anthropic = ">=1.0.0,<2"
mcp = ">=2.1.0,<3"
vegafusion = ">=2.0.3,<3"
vl-convert-python = ">=2.0.0rc1,<3"
python-lsp-server = ">=1.15.0,<2"
websockets = ">=17.0.1,<18"
python-lsp-ruff = ">=2.3.3,<3"
openai = ">=3.3.0,<4"
pip = ">=26.2.1,<27"
seaborn = ">=0.13.2,<0.14"
umap-learn = ">=0.5.12,<0.6"
flaml = ">=2.6.0,<3"
catboost = ">=1.2.10,<2"

[pypi-dependencies]
smartphone_addiction = { path = ".", editable = true }
kaggle = "*"
lightgbm = "<4.7"
miceforest = ">=6"

[feature.dev.dependencies]
ruff = "*"
ty = "*"
pytest = "*"
pytest-cov = "*"

[tasks]
lint      = "ruff check src tests notebooks"
format    = "ruff format src tests notebooks"
typecheck = "ty check src"
test      = "pytest tests/ -v --tb=short"
check     = { depends-on = ["lint", "typecheck", "test"] }
# Competition data: requires ~/.kaggle/kaggle.json (see README)
download  = "kaggle competitions download -c playground-series-s6e8 -p data/raw"
extract   = "python -m zipfile -e data/raw/playground-series-s6e8.zip data/raw/"
data      = { depends-on = ["download", "extract"] }

[environments]
default = { features = ["dev"], solve-group = "default" }
